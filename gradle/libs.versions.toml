[versions]
java = "21"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
springdocOpenapi = "3.0.3"
junitBom = "6.1.3"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

spring-tx = { module = "org.springframework:spring-tx" }
spring-orm = { module = "org.springframework:spring-orm" }
# Jackson 3 (tools.jackson.* coordinates, post-rebrand) - matches what Spring
# Boot 4.1's own autoconfiguration standardizes on; Boot never auto-configures
# a com.fasterxml.jackson.databind.ObjectMapper bean in this version.
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

postgresql = { module = "org.postgresql:postgresql" }

flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }

micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
