spring:
  application:
    name: mini-doodle
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mini_doodle}
    username: ${SPRING_DATASOURCE_USERNAME:mini_doodle}
    password: ${SPRING_DATASOURCE_PASSWORD:mini_doodle}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

outbox:
  publisher:
    fixed-delay: 5000
    batch-size: 50
