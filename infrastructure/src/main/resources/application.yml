spring:
  application:
    name: mini-doodle
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mini_doodle}
    username: ${SPRING_DATASOURCE_USERNAME:mini_doodle}
    password: ${SPRING_DATASOURCE_PASSWORD:mini_doodle}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      # Histogram buckets (not just count/sum/max) for both, so Grafana can
      # do server-side histogram_quantile()/heatmaps (§11) instead of only
      # a mean line - the whole point of freebusy.query.window.days is
      # seeing the shape of the distribution, including rejected oversized
      # windows.
      percentiles-histogram:
        booking.duration: true
        freebusy.query.window.days: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

outbox:
  publisher:
    fixed-delay: 5000
    batch-size: 50
