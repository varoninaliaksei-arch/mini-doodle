services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_doodle}
      POSTGRES_USER: ${POSTGRES_USER:-mini_doodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_doodle}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_doodle} -d ${POSTGRES_DB:-mini_doodle}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mini_doodle}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mini_doodle}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mini_doodle}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
